name: CI StockManagement

# Trigger on every main branch push and pull request
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  adr-index:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Regenerate ADR index
      run: ./scripts/generate-adr-index.sh

    - name: Fail if docs/decisions.md is stale
      run: git diff --exit-code docs/decisions.md

  api-tests:

    # Testcontainers needs Linux containers
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Execute API Integration Tests
      run: dotnet test StockManagement.Api.Tests

  web-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StockManagement.Web

    # The API (ADR-0008) needs Postgres on 127.0.0.1:5432
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: StockManagement.Web/package-lock.json

    - name: Install packages
      run: npm ci

    - name: Execute Web Unit Tests
      run: npm test

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Execute Web E2E Tests
      run: npm run e2e

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: web-screenshots
        path: StockManagement.Web/screenshots

  unit-tests:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Execute Unit Tests
      run: dotnet test StockManagement.Tests

  desktop-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: StockManagement.Desktop

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: StockManagement.Desktop/package-lock.json

    - name: Install packages
      run: npm ci

    - name: Publish bundled API (linux-x64, ADR-0016)
      run: npm run publish-api

    - name: Build (unpacked, no installer)
      run: npx electron-builder --dir